name: BarKeep

options:
  bundleIdPrefix: com.reno
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

targets:
  BarKeep:
    type: application
    platform: macOS
    sources:
      - path: BarKeep
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reno.barkeep
        PRODUCT_NAME: BarKeep
        INFOPLIST_FILE: BarKeep/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: BarKeep/App/BarKeep.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - sdk: ApplicationServices.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: ServiceManagement.framework

schemes:
  BarKeep:
    build:
      targets:
        BarKeep: all
    run:
      config: Debug
    archive:
      config: Release
